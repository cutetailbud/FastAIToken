name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify before release
        run: |
          python scripts/readme/gen.py . --check
          python -m unittest discover -s tests
      - name: Extract release notes from CHANGELOG.md
        run: |
          python - <<'EOF'
          import os, re
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(tag)}\].*?\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          open("RELEASE_NOTES.md", "w", encoding="utf-8").write(m.group(1).strip() if m else f"Release {tag}")
          EOF
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" pricing.json \
            --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag
